name: Release Beta (Windows)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag to build
        required: true
        default: master

jobs:
  release:
    permissions:
      contents: write
    environment: windows-release
    runs-on: windows-latest
    env:
      VITE_AI_DEFAULT_API_KEY: ${{ secrets.VITE_AI_DEFAULT_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: beta-v__VERSION__
          releaseName: TieZ Windows beta v__VERSION__
          releaseBody: Beta build for community testing. Channel=beta; can update to newer beta or stable when published.
          releaseDraft: true
          prerelease: true

      - name: Upload beta bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta-installer
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/nsis/*.nsis.zip
            src-tauri/target/**/bundle/nsis/*.sig
